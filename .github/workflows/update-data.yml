name: Update dashboard data

# Runs whenever an .xlsx file (or the conversion script) changes on main,
# regenerates data.json, and commits it back — GitHub Pages then serves
# the updated file automatically within a minute or two.

on:
  push:
    branches: [main]
    paths:
      - '**/*.xlsx'
      - 'scripts/xlsx_to_json.py'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install openpyxl

      - name: Find the workbook and regenerate data.json
        run: |
          XLSX_FILE=$(ls *.xlsx | head -n 1)
          echo "Using $XLSX_FILE"
          python scripts/xlsx_to_json.py "$XLSX_FILE" data.json

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Auto-update dashboard data from xlsx"
          git push
